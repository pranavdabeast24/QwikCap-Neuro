# INACTIVE TEMPLATE: review paths, then copy to .github/workflows/ to enable.
# This workflow accepts synthetic fixtures only; do not add patient/private data.
name: Build QuickCap (CV) desktop

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: '.'
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install explicit build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Verify native Tk is available
        run: python -c "import tkinter as tk; root = tk.Tk(); root.withdraw(); root.update(); root.destroy()"
      - name: Test synthetic document and spreadsheet workflows
        run: python -m unittest discover -s tests -v
      - name: Build native desktop package
        run: python build_desktop.py --work-dir work/desktop-build --dist-dir dist/desktop
      - name: Exercise both packaged worker modes with fictional data
        run: |
          python - <<'PY'
          import base64
          import json
          from pathlib import Path
          import subprocess
          import sys
          import tempfile
          from branding import APP_BASENAME

          package = Path('dist/desktop') / (f'{APP_BASENAME}.app' if sys.platform == 'darwin' else APP_BASENAME)
          name = 'FormbridgeWorker.exe' if sys.platform == 'win32' else 'FormbridgeWorker'
          helpers = [path for path in package.rglob(name) if path.is_file()]
          assert helpers, 'Companion worker is missing from the GUI package'
          helper = helpers[0].resolve()

          def invoke(kind, request):
              child = subprocess.run([str(helper), kind], input=json.dumps(request), text=True,
                                     capture_output=True, timeout=60, check=True)
              response = json.loads(child.stdout)
              assert 'error' not in response, 'Packaged worker rejected a fictional fixture'
              return response

          with tempfile.TemporaryDirectory(prefix='formbridge-synthetic-ci-') as assets:
              result = invoke('document', {
                  'data': base64.b64encode(b'Record ID: SYNTHETIC-CI').decode('ascii'),
                  'filename': 'fictional.txt', 'assetDir': assets, 'recordId': 'synthetic-ci',
                  'schema': [{'name': 'record_id', 'label': 'Record ID', 'type': 'text', 'required': True}],
              })
              assert result['values']['record_id'] == 'SYNTHETIC-CI'
          result = invoke('template', {
              'operation': 'inspect', 'filename': 'fictional.csv',
              'data': base64.b64encode(b'record_id\n').decode('ascii'),
          })
          assert result['result']['columns'][0]['name'] == 'record_id'
          print('Packaged document and template workers passed fictional smoke checks.')
          PY
      - name: Archive Mac app with bundle permissions and links
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/desktop/QuickCapCV.app dist/QuickCapCV-macOS.zip
      - name: Archive complete Windows application folder
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/desktop/QuickCapCV -DestinationPath dist/QuickCapCV-Windows.zip
      - name: Retain native build for manual review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: QuickCapCV-${{ matrix.os }}
          path: dist/QuickCapCV-*.zip
          if-no-files-found: error
          retention-days: 7
