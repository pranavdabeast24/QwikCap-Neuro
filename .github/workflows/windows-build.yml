name: Verify Windows portable desktop

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      FORMBRIDGE_REQUIRE_OCR: '1'
      FORMBRIDGE_TESSERACT_INSTALLER_SHA256: bee9e3434bd94fd65387d9be28cd467a41f61b1275383b55b0f59a1331270ae4
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python 3.12.10 x64
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.10'
          architecture: x64
      - name: Install pinned application and build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Install hash-verified OCR on the disposable runner
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'tesseract-5.5.3.exe'
          Invoke-WebRequest -Uri 'https://github.com/tesseract-ocr/tesseract/releases/download/5.5.3/tesseract-ocr-w64-setup-5.5.3.20260724.exe' -OutFile $installer
          $actual = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
          if ($actual -ne $env:FORMBRIDGE_TESSERACT_INSTALLER_SHA256) { throw 'OCR installer hash mismatch' }
          $install = Start-Process -FilePath $installer -ArgumentList '/S' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw 'OCR installation failed' }
          $engine = Join-Path $env:ProgramFiles 'Tesseract-OCR\tesseract.exe'
          if (!(Test-Path -LiteralPath $engine -PathType Leaf)) { throw 'OCR executable missing' }
          $english = Join-Path $env:ProgramFiles 'Tesseract-OCR\tessdata\eng.traineddata'
          if (!(Test-Path -LiteralPath $english -PathType Leaf)) { throw 'English OCR data missing' }
          & $engine --version
          if ($LASTEXITCODE -ne 0) { throw 'OCR startup failed' }
          "FORMBRIDGE_TESSERACT=$engine" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Test, build, extract and verify the real portable application
        run: python -B tools/verify_windows_release.py --output work/windows-ci --dist-dir dist/windows
      - name: Retain verified portable ZIP
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: QuickCapCV-Windows-x64
          path: dist/windows/QuickCapCV-Windows-x64.zip
          if-no-files-found: error
          retention-days: 7
      - name: Record generic job outcome
        if: always()
        env:
          WINDOWS_JOB_STATUS: ${{ job.status }}
        run: |
          New-Item -ItemType Directory -Force -Path work/windows-ci/reports | Out-Null
          @{status=$env:WINDOWS_JOB_STATUS; commit=$env:GITHUB_SHA; runner='windows-2022'; architecture='x64'} | ConvertTo-Json | Out-File work/windows-ci/reports/job-status.json -Encoding utf8
      - name: Retain bounded verification reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: QuickCapCV-Windows-verification
          path: work/windows-ci/reports/
          if-no-files-found: warn
          retention-days: 7
